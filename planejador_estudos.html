<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador de Estudos — Uninter</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e5eb;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --green: #059669;
    --green-light: #d1fae5;
    --red: #dc2626;
    --red-light: #fee2e2;
    --amber: #92400e;
    --amber-light: #fef3c7;
    --indigo: #3730a3;
    --indigo-light: #e0e7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0 0 4px; }
  header.top p.sub { margin: 0; color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.overdue .num { color: var(--red); }
  .stat.today .num { color: var(--indigo); }
  .stat.done .num { color: var(--green); }
  .progress-outer { background: #e5e7eb; border-radius: 999px; height: 10px; overflow: hidden; margin-top: 10px; }
  .progress-inner { background: linear-gradient(90deg, var(--accent), #818cf8); height: 100%; transition: width .3s ease; }

  .today-banner {
    background: var(--indigo-light); color: var(--indigo); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 16px;
  }
  .toolbar select, .toolbar label.chk { font-size: 13px; }
  .toolbar select {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  .toolbar .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #f9fafb; }
  .btn-primary:hover { background: #4338ca; }
  .btn-danger-text { background: transparent; color: var(--red); padding: 4px 8px; font-size: 12px; }

  .add-form {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; display: none;
  }
  .add-form.open { display: block; }
  .add-form .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .add-form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .add-form input, .add-form select {
    width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); font: inherit;
  }
  .add-form .aula-note { font-size: 12px; color: var(--muted); margin-bottom: 12px; background: var(--accent-light); padding: 8px 10px; border-radius: 8px; }

  nav.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  nav.tabs button.tab-btn {
    flex: 1; text-align: center; padding: 10px 16px; border-radius: 10px;
    font-weight: 600; font-size: 14px; color: var(--muted); background: var(--card); border: 1px solid var(--border);
  }
  nav.tabs button.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  ul.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .disc-heading {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--accent); margin: 20px 0 8px; padding-top: 4px; border-top: 1px solid var(--border);
  }
  .disc-heading:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  li.task {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px;
  }
  li.task.done { opacity: .55; }
  li.task.overdue { border-color: #fca5a5; background: #fff5f5; }
  li.task.conflict { border-color: #fcd34d; background: #fffbeb; }
  li.task input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; cursor: pointer; }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
  .disc-name { font-size: 11px; color: var(--muted); font-weight: 600; }
  .task-title { font-weight: 600; font-size: 14px; }
  li.task.done .task-title { text-decoration: line-through; }

  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.type-aula { background: #f1f5f9; color: #475569; }
  .badge.type-apol { background: #dbeafe; color: #1d4ed8; }
  .badge.type-apol-disc { background: #ede9fe; color: #6d28d9; }
  .badge.type-prova-obj { background: #fee2e2; color: #b91c1c; }
  .badge.type-prova-disc { background: #ffe4e6; color: #9f1239; }
  .badge.type-trabalho { background: #d1fae5; color: #047857; }
  .badge.warn-overdue { background: var(--red-light); color: var(--red); }
  .badge.warn-conflict { background: var(--amber-light); color: var(--amber); }
  .badge.warn-today { background: var(--indigo-light); color: var(--indigo); }

  .task-meta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); }
  .task-meta input[type=date] {
    padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); font: inherit; font-size: 12px;
  }
  .days-left { font-weight: 700; }
  .days-left.neg { color: var(--red); }
  .days-left.zero { color: var(--indigo); }

  .disc-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .disc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .disc-head h2 { font-size: 16px; margin: 0 0 2px; }
  .disc-head .count { font-size: 12px; color: var(--muted); }
  .disc-head .today-count { font-size: 11px; color: var(--indigo); font-weight: 700; margin-left: 6px; }
  .disc-pct { font-size: 20px; font-weight: 700; color: var(--accent); }
  .toggle-btn { margin-top: 10px; }

  .cal-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .cal-header h2 { margin: 0; font-size: 16px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: 4px; }
  .cal-day {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    min-height: 78px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  }
  .cal-day.empty { background: transparent; border: none; cursor: default; }
  .cal-day.today { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
  .cal-day.selected { background: var(--accent-light); border-color: var(--accent); }
  .cal-day .num { font-size: 12px; font-weight: 700; color: var(--text); }
  .cal-day.today .num { color: var(--indigo); }
  .cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .cal-dot { width: 7px; height: 7px; border-radius: 50%; }
  .cal-dot.type-aula { background: #94a3b8; }
  .cal-dot.type-apol { background: #2563eb; }
  .cal-dot.type-apol-disc { background: #7c3aed; }
  .cal-dot.type-prova-obj { background: #dc2626; }
  .cal-dot.type-prova-disc { background: #be123c; }
  .cal-dot.type-trabalho { background: #059669; }
  .cal-day .overdue-mark { font-size: 10px; color: var(--red); font-weight: 700; }
  .day-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .day-panel h3 { margin: 0 0 10px; font-size: 15px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
  footer.saved { text-align: center; color: var(--muted); font-size: 11px; margin-top: 24px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .task-meta { gap: 10px; }
    .cal-day { min-height: 56px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Planejador de Estudos — Uninter</h1>
    <p class="sub">Lista, disciplinas e calendário, tudo em uma página só (sem depender de vários arquivos).</p>
  </header>

  <div class="stats" id="stats"></div>
  <div id="todayBanner"></div>

  <div class="toolbar">
    <button class="btn-secondary" id="btnToggleForm">+ Adicionar tarefa</button>
    <button class="btn-secondary" id="btnAdvance">Adiantar tudo 1 dia</button>
    <button class="btn-secondary" id="btnRestore">Restaurar plano original</button>
  </div>

  <div class="add-form" id="addForm">
    <div class="grid">
      <div>
        <label>Disciplina</label>
        <select id="f-disc"></select>
      </div>
      <div>
        <label>Tipo</label>
        <select id="f-type"></select>
      </div>
      <div>
        <label>Título</label>
        <input type="text" id="f-title" placeholder="Ex: Leitura do capítulo 3">
      </div>
    </div>
    <div class="aula-note" id="aulaNote" style="display:none;">
      Aulas não têm data — esta será adicionada como a próxima da sequência da disciplina.
    </div>
    <div class="grid" id="dateFields">
      <div>
        <label>Abre em (opcional)</label>
        <input type="date" id="f-opens">
      </div>
      <div>
        <label>Data planejada</label>
        <input type="date" id="f-planned">
      </div>
      <div>
        <label>Prazo real (opcional)</label>
        <input type="date" id="f-deadline">
      </div>
    </div>
    <button class="btn-primary" id="btnSaveTask">Salvar tarefa</button>
    <button class="btn-secondary" id="btnCancelTask">Cancelar</button>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="list">📋 Lista de Tarefas</button>
    <button class="tab-btn" data-tab="disc">📚 Por Disciplina</button>
    <button class="tab-btn" data-tab="cal">🗓️ Calendário</button>
  </nav>

  <!-- ===== ABA: LISTA ===== -->
  <div class="tab-panel active" id="panel-list">
    <div class="toolbar">
      <select id="filterDisc"></select>
      <select id="filterType"></select>
      <label class="chk"><input type="checkbox" id="filterToday"> Somente hoje</label>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <!-- ===== ABA: DISCIPLINAS ===== -->
  <div class="tab-panel" id="panel-disc">
    <div class="toolbar">
      <select id="filterTypeDisc"></select>
    </div>
    <div id="discList"></div>
  </div>

  <!-- ===== ABA: CALENDÁRIO ===== -->
  <div class="tab-panel" id="panel-cal">
    <div class="cal-header">
      <button class="btn-secondary" id="btnPrev">‹ Anterior</button>
      <h2 id="calTitle"></h2>
      <div class="cal-nav">
        <button class="btn-secondary" id="btnTodayNav">Hoje</button>
        <button class="btn-secondary" id="btnNext">Próximo ›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><span class="cal-dot type-apol"></span> APOL Objetiva</span>
      <span><span class="cal-dot type-apol-disc"></span> APOL/Exercício Discursiva</span>
      <span><span class="cal-dot type-prova-obj"></span> Prova Objetiva</span>
      <span><span class="cal-dot type-prova-disc"></span> Prova Discursiva</span>
      <span><span class="cal-dot type-trabalho"></span> Trabalho/Pago</span>
    </div>
    <div class="day-panel" id="dayPanel" style="display:none;">
      <h3 id="dayPanelTitle"></h3>
      <ul class="task-list" id="dayTaskList"></ul>
    </div>
  </div>

  <footer class="saved" id="savedInfo"></footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Constantes e dados ================= */
const STORAGE_KEY = 'uninterPlanner:v2';

const DISCIPLINES = [
  'Comportamento Empreendedor',
  'Design Cultura e Sociedade',
  'Design de Serviço',
  'Processos do Design Thinking',
  'Teoria da Cor',
  'Atividades Extensionistas'
];

const TYPE_META = {
  'aula':        { label: 'Aula',              short: 'Aula' },
  'apol':        { label: 'Apol. Objetiva',    short: 'APOL Obj.' },
  'apol-disc':   { label: 'Apol. Discursiva',  short: 'APOL Disc.' },
  'prova-obj':   { label: 'Prova Objetiva',    short: 'Prova Obj.' },
  'prova-disc':  { label: 'Prova Discursiva',  short: 'Prova Disc.' },
  'trabalho':    { label: 'Trabalho/Pago',     short: 'Trabalho' }
};

function isAula(t) { return t.type === 'aula'; }

function mkAula(id, disc, title, order, done) {
  return { id, disc, title, type: 'aula', order, opens: null, deadline: null, planned: null, originalPlanned: null, done: !!done, completedAt: null, custom: false };
}
function mkActivity(id, disc, title, type, opens, planned, deadline, done, completedAt) {
  return { id, disc, title, type, order: null, opens: opens || null, deadline: deadline || null, planned, originalPlanned: planned, done: !!done, completedAt: completedAt || null, custom: false };
}

// Dados iniciais de exemplo.
// Comportamento Empreendedor: datas reais conferidas na tela de Avaliações da Uninter.
// Demais disciplinas: aberturas estimadas (mesmo padrão de janela da Uninter) — ajuste quando
// tiver os prints reais. Design de Serviço fica de propósito com a data planejada depois do
// prazo, só para mostrar o aviso de "prazo ultrapassado" funcionando.
function buildSeed() {
  return [
    // Comportamento Empreendedor
    mkAula('ce-aula-1', DISCIPLINES[0], 'Aula 1', 1, true),
    mkAula('ce-aula-2', DISCIPLINES[0], 'Aula 2', 2, false),
    mkAula('ce-aula-3', DISCIPLINES[0], 'Aula 3', 3, false),
    mkAula('ce-aula-4', DISCIPLINES[0], 'Aula 4', 4, false),
    mkAula('ce-aula-5', DISCIPLINES[0], 'Aula 5', 5, false),
    mkAula('ce-aula-6', DISCIPLINES[0], 'Aula 6', 6, false),
    mkActivity('ce-apol-obj-1', DISCIPLINES[0], 'APOL Objetiva 1', 'apol', '2026-07-13', '2026-08-20', '2026-08-24', false),
    mkActivity('ce-apol-obj-2', DISCIPLINES[0], 'APOL Objetiva 2', 'apol', '2026-08-03', '2026-08-21', '2026-08-24', false),
    mkActivity('ce-exercicio-disc', DISCIPLINES[0], 'Exercício Discursiva', 'apol-disc', '2026-07-13', '2026-09-10', '2026-09-14', false),
    mkActivity('ce-prova-obj', DISCIPLINES[0], 'Prova Objetiva', 'prova-obj', '2026-08-24', '2026-09-12', '2026-09-14', false),
    mkActivity('ce-prova-disc', DISCIPLINES[0], 'Prova Discursiva', 'prova-disc', '2026-08-24', '2026-09-13', '2026-09-14', false),

    // Design Cultura e Sociedade
    mkAula('dcs-aula-1', DISCIPLINES[1], 'Aula 1', 1, false),
    mkAula('dcs-aula-2', DISCIPLINES[1], 'Aula 2', 2, false),
    mkAula('dcs-aula-3', DISCIPLINES[1], 'Aula 3', 3, false),
    mkAula('dcs-aula-4', DISCIPLINES[1], 'Aula 4', 4, false),
    mkActivity('dcs-apol-obj-1', DISCIPLINES[1], 'APOL Objetiva 1', 'apol', '2026-07-13', '2026-08-20', '2026-08-24', false),
    mkActivity('dcs-apol-obj-2', DISCIPLINES[1], 'APOL Objetiva 2', 'apol', '2026-08-03', '2026-08-21', '2026-08-24', false),
    mkActivity('dcs-exercicio-disc', DISCIPLINES[1], 'Exercício Discursiva', 'apol-disc', '2026-07-13', '2026-09-10', '2026-09-14', false),
    mkActivity('dcs-prova-obj', DISCIPLINES[1], 'Prova Objetiva', 'prova-obj', '2026-08-24', '2026-09-12', '2026-09-14', false),
    mkActivity('dcs-prova-disc', DISCIPLINES[1], 'Prova Discursiva', 'prova-disc', '2026-08-24', '2026-09-13', '2026-09-14', false),

    // Design de Serviço
    mkAula('ds-aula-1', DISCIPLINES[2], 'Aula 1', 1, true),
    mkAula('ds-aula-2', DISCIPLINES[2], 'Aula 2', 2, true),
    mkAula('ds-aula-3', DISCIPLINES[2], 'Aula 3', 3, true),
    mkAula('ds-aula-4', DISCIPLINES[2], 'Aula 4', 4, false),
    mkActivity('ds-apol-obj', DISCIPLINES[2], 'APOL Objetiva', 'apol', '2026-07-23', '2026-09-01', '2026-09-03', false),
    mkActivity('ds-apol-disc', DISCIPLINES[2], 'APOL Discursiva', 'apol-disc', '2026-07-23', '2026-09-05', '2026-09-03', false),
    mkActivity('ds-prova-obj', DISCIPLINES[2], 'Prova Objetiva', 'prova-obj', '2026-09-03', '2026-09-28', '2026-10-02', false),
    mkActivity('ds-prova-disc', DISCIPLINES[2], 'Prova Discursiva', 'prova-disc', '2026-09-03', '2026-09-29', '2026-10-02', false),
    mkActivity('ds-trabalho-2c', DISCIPLINES[2], 'Atividade Prática Design — 2ª chamada (requer pagamento de taxa)', 'trabalho', '2026-07-27', '2026-08-05', '2026-08-10', false),

    // Processos do Design Thinking
    mkAula('pdt-aula-1', DISCIPLINES[3], 'Aula 1', 1, false),
    mkAula('pdt-aula-2', DISCIPLINES[3], 'Aula 2', 2, false),
    mkAula('pdt-aula-3', DISCIPLINES[3], 'Aula 3', 3, false),
    mkAula('pdt-aula-4', DISCIPLINES[3], 'Aula 4', 4, false),
    mkActivity('pdt-apol-obj-1', DISCIPLINES[3], 'APOL Objetiva 1', 'apol', '2026-07-13', '2026-08-20', '2026-08-24', true, '2026-08-01'),
    mkActivity('pdt-apol-obj-2', DISCIPLINES[3], 'APOL Objetiva 2', 'apol', '2026-08-03', '2026-08-21', '2026-08-24', false),
    mkActivity('pdt-exercicio-disc', DISCIPLINES[3], 'Exercício Discursiva', 'apol-disc', '2026-07-13', '2026-09-10', '2026-09-14', true, '2026-08-01'),
    mkActivity('pdt-prova-obj', DISCIPLINES[3], 'Prova Objetiva', 'prova-obj', '2026-08-24', '2026-09-12', '2026-09-14', false),
    mkActivity('pdt-prova-disc', DISCIPLINES[3], 'Prova Discursiva', 'prova-disc', '2026-08-24', '2026-09-13', '2026-09-14', false),

    // Teoria da Cor
    mkAula('tc-aula-1', DISCIPLINES[4], 'Aula 1', 1, false),
    mkAula('tc-aula-2', DISCIPLINES[4], 'Aula 2', 2, false),
    mkAula('tc-aula-3', DISCIPLINES[4], 'Aula 3', 3, false),
    mkAula('tc-aula-4', DISCIPLINES[4], 'Aula 4', 4, false),
    mkActivity('tc-apol-obj-1', DISCIPLINES[4], 'APOL Objetiva 1', 'apol', '2026-07-13', '2026-08-20', '2026-08-24', false),
    mkActivity('tc-apol-obj-2', DISCIPLINES[4], 'APOL Objetiva 2', 'apol', '2026-08-03', '2026-08-21', '2026-08-24', false),
    mkActivity('tc-prova-obj', DISCIPLINES[4], 'Prova Objetiva', 'prova-obj', '2026-08-24', '2026-09-12', '2026-09-14', false),
    mkActivity('tc-trabalho', DISCIPLINES[4], 'Atividade Prática Design', 'trabalho', '2026-08-17', '2026-09-01', '2026-09-14', false),

    // Atividades Extensionistas (sem aulas — só entregas)
    mkActivity('ae-trab-1', DISCIPLINES[5], 'Planilha 1 - Perfil Empreendedor', 'trabalho', '2026-06-08', '2026-07-04', '2026-07-06', true, '2026-07-04'),
    mkActivity('ae-trab-2', DISCIPLINES[5], 'Planilha 2 - Geração de Ideia de Negócios', 'trabalho', '2026-07-06', '2026-08-05', '2026-08-10', false)
  ];
}

/* ================= Utilitários de data ================= */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(dateStr, delta) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) {
  const [ay,am,ad] = a.split('-').map(Number);
  const [by,bm,bd] = b.split('-').map(Number);
  return Math.round((new Date(by,bm-1,bd) - new Date(ay,am-1,ad)) / 86400000);
}
function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function pad2(n) { return String(n).padStart(2, '0'); }

/* ================= Persistência (localStorage) ================= */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tasks)) return parsed;
    }
  } catch (e) { /* dados corrompidos: recria a partir da seed */ }
  const fresh = { tasks: buildSeed(), updatedAt: null };
  saveData(fresh);
  return fresh;
}
function saveData(data) {
  data.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DATA = loadData();

/* ================= Regras derivadas ================= */
function effectiveDate(t) { return t.deadline || t.planned; }
function isOverdue(t) { return !isAula(t) && !t.done && !!effectiveDate(t) && effectiveDate(t) < todayStr(); }
function hasConflict(t) { return !isAula(t) && !!t.deadline && !!t.planned && t.planned > t.deadline; }
function hasEarlyConflict(t) { return !isAula(t) && !!t.opens && !!t.planned && t.planned < t.opens; }
function isTodayTask(t) { return !isAula(t) && t.planned === todayStr(); }
function daysLeftLabel(t) {
  const n = daysBetween(todayStr(), effectiveDate(t));
  if (n === 0) return { text: 'hoje', cls: 'zero' };
  if (n < 0) return { text: `há ${Math.abs(n)}d`, cls: 'neg' };
  return { text: `em ${n}d`, cls: '' };
}
function orderedTasksForDisc(tasks) {
  const aulas = tasks.filter(isAula).sort((a,b) => a.order - b.order);
  const activities = tasks.filter(t => !isAula(t)).sort((a,b) => (a.planned || '').localeCompare(b.planned || ''));
  return [...aulas, ...activities];
}

/* ================= Toast ================= */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================= Abas ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
  });
});

/* ================= Selects compartilhados ================= */
function populateSelects() {
  const opts = (list, allLabel) => (allLabel ? `<option value="">${allLabel}</option>` : '') + list;

  document.getElementById('filterDisc').innerHTML = opts(
    DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join(''), 'Todas as disciplinas');
  document.getElementById('filterType').innerHTML = opts(
    Object.entries(TYPE_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join(''), 'Todos os tipos');
  document.getElementById('filterTypeDisc').innerHTML = opts(
    Object.entries(TYPE_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join(''), 'Todos os tipos');
  document.getElementById('f-disc').innerHTML = DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join('');
  document.getElementById('f-type').innerHTML = Object.entries(TYPE_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
}

/* ================= Stats + banner (compartilhados) ================= */
const listFilters = { disc: '', type: '', onlyToday: false };

function renderStats() {
  const total = DATA.tasks.length;
  const done = DATA.tasks.filter(t => t.done).length;
  const overdue = DATA.tasks.filter(isOverdue).length;
  const today = DATA.tasks.filter(t => !t.done && isTodayTask(t)).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="num">${pct}%</div>
      <div class="label">Progresso geral</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    </div>
    <div class="stat done"><div class="num">${done}/${total}</div><div class="label">Concluídas</div></div>
    <div class="stat overdue"><div class="num">${overdue}</div><div class="label">Atrasadas</div></div>
    <div class="stat today"><div class="num">${today}</div><div class="label">Para hoje</div></div>
  `;

  const banner = document.getElementById('todayBanner');
  if (today > 0) {
    banner.innerHTML = `<div class="today-banner">
      <span>📅 Hoje (${fmtDate(todayStr())}): ${today} tarefa${today>1?'s':''} planejada${today>1?'s':''}</span>
      <label class="chk" style="font-weight:400;"><input type="checkbox" id="bannerFocus"> Mostrar só essas na Lista</label>
    </div>`;
    document.getElementById('bannerFocus').checked = listFilters.onlyToday;
    document.getElementById('bannerFocus').addEventListener('change', e => {
      listFilters.onlyToday = e.target.checked;
      document.getElementById('filterToday').checked = e.target.checked;
      renderListPanel();
    });
  } else {
    banner.innerHTML = '';
  }
}

/* ================= Linha de tarefa (compartilhada) ================= */
function taskRowHtml(t, opts) {
  opts = opts || {};
  const overdue = isOverdue(t);
  const conflict = hasConflict(t);
  const early = hasEarlyConflict(t);
  const today = !t.done && isTodayTask(t);
  const cls = ['task'];
  if (t.done) cls.push('done');
  else if (overdue) cls.push('overdue');
  else if (conflict || early) cls.push('conflict');

  const metaParts = [];
  if (!isAula(t)) {
    if (t.opens) metaParts.push(`<span>Abre: ${fmtDate(t.opens)}</span>`);
    metaParts.push(`<span>Planejada: <input type="date" class="inp-planned" data-id="${t.id}" value="${t.planned}"></span>`);
    if (t.deadline) metaParts.push(`<span>Prazo real: <strong>${fmtDate(t.deadline)}</strong></span>`);
    const dl = daysLeftLabel(t);
    metaParts.push(`<span class="days-left ${dl.cls}">${dl.text}</span>`);
  }
  if (t.done && t.completedAt) metaParts.push(`<span>Concluída em ${fmtDate(t.completedAt)}</span>`);
  if (t.custom) metaParts.push(`<button class="btn-danger-text" data-del="${t.id}">Excluir</button>`);

  return `
    <li class="${cls.join(' ')}" data-id="${t.id}">
      <input type="checkbox" class="chk-done" data-id="${t.id}" ${t.done ? 'checked' : ''}>
      <div class="task-body">
        <div class="task-top">
          ${opts.showDisc ? `<span class="disc-name">${t.disc}</span>` : ''}
          <span class="badge type-${t.type}">${TYPE_META[t.type].short}</span>
          ${overdue ? '<span class="badge warn-overdue">⚠ Atrasada</span>' : ''}
          ${conflict ? '<span class="badge warn-conflict">⚠ Prazo ultrapassado</span>' : ''}
          ${early ? '<span class="badge warn-conflict">⚠ Planejada antes de abrir</span>' : ''}
          ${today ? '<span class="badge warn-today">📅 Hoje</span>' : ''}
        </div>
        <div class="task-title">${t.title}</div>
        <div class="task-meta">${metaParts.join('')}</div>
      </div>
    </li>
  `;
}

function bindTaskRowEvents(container) {
  container.querySelectorAll('.chk-done').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const t = DATA.tasks.find(x => x.id === id);
      t.done = e.target.checked;
      t.completedAt = e.target.checked ? todayStr() : null;
      saveData(DATA);
      renderAll();
    });
  });
  container.querySelectorAll('.inp-planned').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const t = DATA.tasks.find(x => x.id === id);
      t.planned = e.target.value;
      saveData(DATA);
      renderAll();
    });
  });
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.target.dataset.del;
      DATA.tasks = DATA.tasks.filter(x => x.id !== id);
      saveData(DATA);
      renderAll();
      showToast('Tarefa excluída.');
    });
  });
}

/* ================= Aba: Lista ================= */
function renderListPanel() {
  const list = document.getElementById('taskList');

  let tasks = [...DATA.tasks];
  if (listFilters.disc) tasks = tasks.filter(t => t.disc === listFilters.disc);
  if (listFilters.type) tasks = tasks.filter(t => t.type === listFilters.type);
  if (listFilters.onlyToday) tasks = tasks.filter(t => !t.done && isTodayTask(t));

  const discsToShow = listFilters.disc ? [listFilters.disc] : DISCIPLINES;
  let html = '';
  discsToShow.forEach(disc => {
    const discTasks = orderedTasksForDisc(tasks.filter(t => t.disc === disc));
    if (discTasks.length === 0) return;
    html += `<div class="disc-heading">${disc}</div>`;
    html += discTasks.map(t => taskRowHtml(t, { showDisc: false })).join('');
  });
  list.innerHTML = html || '<div class="empty">Nenhuma tarefa encontrada com esses filtros.</div>';
  bindTaskRowEvents(list);
}

/* ================= Aba: Disciplinas ================= */
const discState = { type: '', expanded: new Set() };

function renderDiscPanel() {
  const container = document.getElementById('discList');

  container.innerHTML = DISCIPLINES.map(disc => {
    let tasks = DATA.tasks.filter(t => t.disc === disc);
    if (discState.type) tasks = tasks.filter(t => t.type === discState.type);
    tasks = orderedTasksForDisc(tasks);

    const allTasks = DATA.tasks.filter(t => t.disc === disc);
    const total = allTasks.length;
    const done = allTasks.filter(t => t.done).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const todayCount = allTasks.filter(t => !t.done && isTodayTask(t)).length;
    const isOpen = discState.expanded.has(disc);

    return `
      <div class="disc-card" data-disc="${disc}">
        <div class="disc-head">
          <div>
            <h2>${disc}</h2>
            <span class="count">${done}/${total} concluídas${todayCount ? `<span class="today-count">· ${todayCount} hoje</span>` : ''}</span>
          </div>
          <div class="disc-pct">${pct}%</div>
        </div>
        <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
        <button class="btn-secondary toggle-btn" data-toggle="${disc}">${isOpen ? 'Ocultar tarefas ▴' : 'Ver tarefas ▾'}</button>
        ${isOpen ? `<ul class="task-list">${tasks.length ? tasks.map(t => taskRowHtml(t, { showDisc: false })).join('') : '<li style="color:var(--muted); font-size:13px; padding:8px;">Nenhuma tarefa com esse filtro.</li>'}</ul>` : ''}
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', e => {
      const disc = e.target.dataset.toggle;
      if (discState.expanded.has(disc)) discState.expanded.delete(disc); else discState.expanded.add(disc);
      renderDiscPanel();
    });
  });
  bindTaskRowEvents(container);
}

/* ================= Aba: Calendário ================= */
const nowRef = new Date();
const calState = { year: nowRef.getFullYear(), month: nowRef.getMonth(), selectedDate: todayStr() };
const MONTH_NAMES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW_NAMES = ['dom','seg','ter','qua','qui','sex','sáb'];

function tasksByDate() {
  const map = {};
  DATA.tasks.forEach(t => {
    if (isAula(t) || !t.planned) return;
    (map[t.planned] = map[t.planned] || []).push(t);
  });
  return map;
}

function renderCalPanel() {
  const monthName = MONTH_NAMES[calState.month];
  document.getElementById('calTitle').textContent = `${monthName.charAt(0).toUpperCase()}${monthName.slice(1)} de ${calState.year}`;

  const grid = document.getElementById('calGrid');
  const byDate = tasksByDate();

  let html = DOW_NAMES.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDay = new Date(calState.year, calState.month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) html += `<div class="cal-day empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calState.year}-${pad2(calState.month+1)}-${pad2(day)}`;
    const dayTasks = byDate[dateStr] || [];
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === calState.selectedDate;
    const hasOverdue = dayTasks.some(isOverdue);
    const dots = dayTasks.slice(0, 8).map(t => `<span class="cal-dot type-${t.type}"></span>`).join('');

    html += `
      <div class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${dateStr}">
        <div class="num">${day}</div>
        <div class="cal-dots">${dots}</div>
        ${hasOverdue ? '<div class="overdue-mark">⚠ atrasada</div>' : ''}
      </div>
    `;
  }

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      calState.selectedDate = el.dataset.date;
      renderCalPanel();
      renderDayPanel();
    });
  });
}

function renderDayPanel() {
  const panel = document.getElementById('dayPanel');
  const byDate = tasksByDate();
  const tasks = (byDate[calState.selectedDate] || []).sort((a,b) => a.title.localeCompare(b.title));

  panel.style.display = 'block';
  document.getElementById('dayPanelTitle').textContent = `${fmtDate(calState.selectedDate)}${calState.selectedDate === todayStr() ? ' (hoje)' : ''}`;

  const list = document.getElementById('dayTaskList');
  list.innerHTML = tasks.length
    ? tasks.map(t => taskRowHtml(t, { showDisc: true })).join('')
    : '<div class="empty">Nenhuma atividade planejada para esse dia.</div>';
  bindTaskRowEvents(list);
}

/* ================= Info de salvamento ================= */
function renderSavedInfo() {
  const el = document.getElementById('savedInfo');
  if (!DATA.updatedAt) { el.textContent = ''; return; }
  const d = new Date(DATA.updatedAt);
  el.textContent = `Última atualização: ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;
}

function renderAll() {
  renderStats();
  renderListPanel();
  renderDiscPanel();
  renderCalPanel();
  renderDayPanel();
  renderSavedInfo();
}

/* ================= Ações: filtros ================= */
document.getElementById('filterDisc').addEventListener('change', e => { listFilters.disc = e.target.value; renderListPanel(); });
document.getElementById('filterType').addEventListener('change', e => { listFilters.type = e.target.value; renderListPanel(); });
document.getElementById('filterToday').addEventListener('change', e => { listFilters.onlyToday = e.target.checked; renderListPanel(); });
document.getElementById('filterTypeDisc').addEventListener('change', e => { discState.type = e.target.value; renderDiscPanel(); });

/* ================= Ações: calendário ================= */
document.getElementById('btnPrev').addEventListener('click', () => {
  calState.month--;
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  renderCalPanel();
});
document.getElementById('btnNext').addEventListener('click', () => {
  calState.month++;
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  renderCalPanel();
});
document.getElementById('btnTodayNav').addEventListener('click', () => {
  calState.year = nowRef.getFullYear();
  calState.month = nowRef.getMonth();
  calState.selectedDate = todayStr();
  renderCalPanel();
  renderDayPanel();
});

/* ================= Ações: formulário de nova tarefa ================= */
document.getElementById('btnToggleForm').addEventListener('click', () => {
  const form = document.getElementById('addForm');
  form.classList.toggle('open');
  if (form.classList.contains('open')) document.getElementById('f-planned').value = todayStr();
});
document.getElementById('btnCancelTask').addEventListener('click', () => {
  document.getElementById('addForm').classList.remove('open');
});
document.getElementById('f-type').addEventListener('change', e => {
  const isAulaType = e.target.value === 'aula';
  document.getElementById('aulaNote').style.display = isAulaType ? 'block' : 'none';
  document.getElementById('dateFields').style.display = isAulaType ? 'none' : 'grid';
});
document.getElementById('btnSaveTask').addEventListener('click', () => {
  const disc = document.getElementById('f-disc').value;
  const type = document.getElementById('f-type').value;
  const title = document.getElementById('f-title').value.trim();

  if (!title) {
    showToast('Preencha ao menos o título.');
    return;
  }

  const id = `custom-${Math.random().toString(36).slice(2, 10)}`;

  if (type === 'aula') {
    const order = DATA.tasks.filter(t => t.disc === disc && isAula(t)).length + 1;
    DATA.tasks.push({ id, disc, title, type: 'aula', order, opens: null, deadline: null, planned: null, originalPlanned: null, done: false, completedAt: null, custom: true });
  } else {
    const planned = document.getElementById('f-planned').value;
    if (!planned) { showToast('Preencha a data planejada.'); return; }
    const opens = document.getElementById('f-opens').value || null;
    const deadline = document.getElementById('f-deadline').value || null;
    DATA.tasks.push({ id, disc, title, type, order: null, opens, deadline, planned, originalPlanned: null, done: false, completedAt: null, custom: true });
  }
  saveData(DATA);

  document.getElementById('f-title').value = '';
  document.getElementById('f-opens').value = '';
  document.getElementById('f-deadline').value = '';
  document.getElementById('addForm').classList.remove('open');
  renderAll();
  showToast('Tarefa adicionada.');
});

/* ================= Ações: adiantar / restaurar ================= */
document.getElementById('btnAdvance').addEventListener('click', () => {
  DATA.tasks.forEach(t => { if (!t.done && t.planned) t.planned = addDays(t.planned, -1); });
  saveData(DATA);
  renderAll();
  showToast('Datas planejadas adiantadas em 1 dia.');
});
document.getElementById('btnRestore').addEventListener('click', () => {
  if (!confirm('Restaurar todas as datas planejadas para o plano original? Isso não afeta o status de concluído nem tarefas adicionadas manualmente.')) return;
  DATA.tasks.forEach(t => { if (t.originalPlanned) t.planned = t.originalPlanned; });
  saveData(DATA);
  renderAll();
  showToast('Plano original restaurado.');
});

/* ================= Init ================= */
populateSelects();
renderAll();
</script>
