<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador de Estudos — Lista de Tarefas</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e5eb;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --green: #059669;
    --green-light: #d1fae5;
    --red: #dc2626;
    --red-light: #fee2e2;
    --amber: #92400e;
    --amber-light: #fef3c7;
    --indigo: #3730a3;
    --indigo-light: #e0e7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  nav.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  nav.tabs a {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
  }
  nav.tabs a.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0 0 4px; }
  header.top p.sub { margin: 0; color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.overdue .num { color: var(--red); }
  .stat.today .num { color: var(--indigo); }
  .stat.done .num { color: var(--green); }

  .progress-outer { background: #e5e7eb; border-radius: 999px; height: 10px; overflow: hidden; margin-top: 10px; }
  .progress-inner { background: linear-gradient(90deg, var(--accent), #818cf8); height: 100%; transition: width .3s ease; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-bottom: 16px;
  }
  .toolbar select, .toolbar label.chk { font-size: 13px; }
  .toolbar select {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text);
  }
  .toolbar .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #f9fafb; }
  .btn-primary:hover { background: #4338ca; }
  .btn-danger-text { background: transparent; color: var(--red); padding: 4px 8px; font-size: 12px; }

  .today-banner {
    background: var(--indigo-light); color: var(--indigo); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .add-form {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; display: none;
  }
  .add-form.open { display: block; }
  .add-form .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .add-form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .add-form input, .add-form select {
    width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); font: inherit;
  }
  .add-form .aula-note { font-size: 12px; color: var(--muted); margin-bottom: 12px; background: var(--accent-light); padding: 8px 10px; border-radius: 8px; }

  ul.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .disc-heading {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--accent); margin: 20px 0 8px; padding-top: 4px; border-top: 1px solid var(--border);
  }
  .disc-heading:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  li.task {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px;
  }
  li.task.done { opacity: .55; }
  li.task.overdue { border-color: #fca5a5; background: #fff5f5; }
  li.task.conflict { border-color: #fcd34d; background: #fffbeb; }

  li.task input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; cursor: pointer; }
  .task-body { flex: 1; min-width: 0; }
  .task-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
  .task-title { font-weight: 600; font-size: 14px; }
  li.task.done .task-title { text-decoration: line-through; }

  .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .badge.type-aula { background: #f1f5f9; color: #475569; }
  .badge.type-apol { background: #dbeafe; color: #1d4ed8; }
  .badge.type-apol-disc { background: #ede9fe; color: #6d28d9; }
  .badge.type-prova-obj { background: #fee2e2; color: #b91c1c; }
  .badge.type-prova-disc { background: #ffe4e6; color: #9f1239; }
  .badge.type-trabalho { background: #d1fae5; color: #047857; }
  .badge.warn-overdue { background: var(--red-light); color: var(--red); }
  .badge.warn-conflict { background: var(--amber-light); color: var(--amber); }
  .badge.warn-today { background: var(--indigo-light); color: var(--indigo); }

  .task-meta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); }
  .task-meta .field { display: flex; align-items: center; gap: 4px; }
  .task-meta input[type=date] {
    padding: 3px 6px; border-radius: 6px; border: 1px solid var(--border); font: inherit; font-size: 12px;
  }
  .days-left { font-weight: 700; }
  .days-left.neg { color: var(--red); }
  .days-left.zero { color: var(--indigo); }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
  footer.saved { text-align: center; color: var(--muted); font-size: 11px; margin-top: 24px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .task-meta { gap: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs">
    <a href="planejador_estudos.html" class="active">📋 Lista de Tarefas</a>
    <a href="disciplinas.html">📚 Por Disciplina</a>
    <a href="calendario.html">🗓️ Calendário</a>
  </nav>

  <header class="top">
    <h1>Planejador de Estudos — Uninter</h1>
    <p class="sub">Agrupado por disciplina: aulas em sequência, depois as atividades por data.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div id="todayBanner"></div>

  <div class="toolbar">
    <select id="filterDisc"></select>
    <select id="filterType"></select>
    <label class="chk"><input type="checkbox" id="filterToday"> Somente hoje</label>
    <div class="spacer"></div>
    <button class="btn-secondary" id="btnToggleForm">+ Adicionar tarefa</button>
    <button class="btn-secondary" id="btnAdvance">Adiantar tudo 1 dia</button>
    <button class="btn-secondary" id="btnRestore">Restaurar plano original</button>
  </div>

  <div class="add-form" id="addForm">
    <div class="grid">
      <div>
        <label>Disciplina</label>
        <select id="f-disc"></select>
      </div>
      <div>
        <label>Tipo</label>
        <select id="f-type"></select>
      </div>
      <div>
        <label>Título</label>
        <input type="text" id="f-title" placeholder="Ex: Leitura do capítulo 3">
      </div>
    </div>
    <div class="aula-note" id="aulaNote" style="display:none;">
      Aulas não têm data — esta será adicionada como a próxima da sequência da disciplina.
    </div>
    <div class="grid" id="dateFields">
      <div>
        <label>Abre em (opcional)</label>
        <input type="date" id="f-opens">
      </div>
      <div>
        <label>Data planejada</label>
        <input type="date" id="f-planned">
      </div>
      <div>
        <label>Prazo real (opcional)</label>
        <input type="date" id="f-deadline">
      </div>
    </div>
    <button class="btn-primary" id="btnSaveTask">Salvar tarefa</button>
    <button class="btn-secondary" id="btnCancelTask">Cancelar</button>
  </div>

  <ul class="task-list" id="taskList"></ul>

  <footer class="saved" id="savedInfo"></footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Constantes e dados ---------- */
const STORAGE_KEY = 'uninterPlanner:v2';

const DISCIPLINES = [
  'Comportamento Empreendedor',
  'Design Cultura e Sociedade',
  'Design de Serviço',
  'Processos do Design Thinking',
  'Teoria da Cor',
  'Atividades Extensionistas'
];

const TYPE_META = {
  'aula':        { label: 'Aula',              short: 'Aula' },
  'apol':        { label: 'Apol. Objetiva',    short: 'APOL Obj.' },
  'apol-disc':   { label: 'Apol. Discursiva',  short: 'APOL Disc.' },
  'prova-obj':   { label: 'Prova Objetiva',    short: 'Prova Obj.' },
  'prova-disc':  { label: 'Prova Discursiva',  short: 'Prova Disc.' },
  'trabalho':    { label: 'Trabalho/Pago',     short: 'Trabalho' }
};

function isAula(t) { return t.type === 'aula'; }

function mkAula(id, disc, title, order, done) {
  return { id, disc, title, type: 'aula', order, opens: null, deadline: null, planned: null, originalPlanned: null, done: !!done, completedAt: null, custom: false };
}
function mkActivity(id, disc, title, type, opens, planned, deadline, done) {
  return { id, disc, title, type, order: null, opens: opens || null, deadline: deadline || null, planned, originalPlanned: planned, done: !!done, completedAt: null, custom: false };
}

// Dados iniciais de exemplo.
// Comportamento Empreendedor: datas reais conferidas na tela de Avaliações da Uninter.
// Demais disciplinas: aberturas estimadas (mesmo padrão de janela da Uninter) — ajuste quando
// tiver os prints reais. Um item de exemplo (Design de Serviço) fica de propósito com a data
// planejada depois do prazo, só para mostrar o aviso de "prazo ultrapassado" funcionando.
function buildSeed() {
  const seed = [
    // Comportamento Empreendedor
    mkAula('ce-aula-1', DISCIPLINES[0], 'Aula 1', 1, true),
    mkAula('ce-aula-2', DISCIPLINES[0], 'Aula 2', 2, false),
    mkAula('ce-aula-3', DISCIPLINES[0], 'Aula 3', 3, false),
    mkAula('ce-aula-4', DISCIPLINES[0], 'Aula 4', 4, false),
    mkAula('ce-aula-5', DISCIPLINES[0], 'Aula 5', 5, false),
    mkAula('ce-aula-6', DISCIPLINES[0], 'Aula 6', 6, false),
    mkActivity('ce-apol-obj-1', DISCIPLINES[0], 'APOL Objetiva 1', 'apol', '2026-07-13', '2026-08-20', '2026-08-24', false),
    mkActivity('ce-apol-obj-2', DISCIPLINES[0], 'APOL Objetiva 2', 'apol', '2026-08-03', '2026-08-21', '2026-08-24', false),
    mkActivity('ce-exercicio-disc', DISCIPLINES[0], 'Exercício Discursiva', 'apol-disc', '2026-07-13', '2026-09-10', '2026-09-14', false),
    mkActivity('ce-prova-obj', DISCIPLINES[0], 'Prova Objetiva', 'prova-obj', '2026-08-24', '2026-09-12', '2026-09-14', false),
    mkActivity('ce-prova-disc', DISCIPLINES[0], 'Prova Discursiva', 'prova-disc', '2026-08-24', '2026-09-13', '2026-09-14', false),

    // Design Cultura e Sociedade
    mkAula('dcs-aula-1', DISCIPLINES[1], 'Aula 1', 1, false),
    mkAula('dcs-aula-2', DISCIPLINES[1], 'Aula 2', 2, false),
    mkAula('dcs-aula-3', DISCIPLINES[1], 'Aula 3', 3, false),
    mkAula('dcs-aula-4', DISCIPLINES[1], 'Aula 4', 4, false),
    mkActivity('dcs-apol-obj', DISCIPLINES[1], 'APOL Objetiva', 'apol', '2026-07-19', '2026-08-28', '2026-08-30', false),
    mkActivity('dcs-apol-disc', DISCIPLINES[1], 'APOL Discursiva', 'apol-disc', '2026-07-19', '2026-08-29', '2026-08-30', false),
    mkActivity('dcs-prova-obj', DISCIPLINES[1], 'Prova Objetiva', 'prova-obj', '2026-08-30', '2026-09-20', '2026-09-25', false),
    mkActivity('dcs-prova-disc', DISCIPLINES[1], 'Prova Discursiva', 'prova-disc', '2026-08-30', '2026-09-21', '2026-09-25', false),

    // Design de Serviço
    mkAula('ds-aula-1', DISCIPLINES[2], 'Aula 1', 1, false),
    mkAula('ds-aula-2', DISCIPLINES[2], 'Aula 2', 2, false),
    mkAula('ds-aula-3', DISCIPLINES[2], 'Aula 3', 3, false),
    mkAula('ds-aula-4', DISCIPLINES[2], 'Aula 4', 4, false),
    mkActivity('ds-apol-obj', DISCIPLINES[2], 'APOL Objetiva', 'apol', '2026-07-23', '2026-09-01', '2026-09-03', false),
    mkActivity('ds-apol-disc', DISCIPLINES[2], 'APOL Discursiva', 'apol-disc', '2026-07-23', '2026-09-05', '2026-09-03', false),
    mkActivity('ds-prova-obj', DISCIPLINES[2], 'Prova Objetiva', 'prova-obj', '2026-09-03', '2026-09-28', '2026-10-02', false),
    mkActivity('ds-prova-disc', DISCIPLINES[2], 'Prova Discursiva', 'prova-disc', '2026-09-03', '2026-09-29', '2026-10-02', false),

    // Processos do Design Thinking
    mkAula('pdt-aula-1', DISCIPLINES[3], 'Aula 1', 1, false),
    mkAula('pdt-aula-2', DISCIPLINES[3], 'Aula 2', 2, false),
    mkAula('pdt-aula-3', DISCIPLINES[3], 'Aula 3', 3, false),
    mkAula('pdt-aula-4', DISCIPLINES[3], 'Aula 4', 4, false),
    mkActivity('pdt-apol-obj', DISCIPLINES[3], 'APOL Objetiva', 'apol', '2026-07-25', '2026-09-02', '2026-09-05', false),
    mkActivity('pdt-apol-disc', DISCIPLINES[3], 'APOL Discursiva', 'apol-disc', '2026-07-25', '2026-09-03', '2026-09-05', false),
    mkActivity('pdt-prova-obj', DISCIPLINES[3], 'Prova Objetiva', 'prova-obj', '2026-09-05', '2026-10-05', '2026-10-10', false),
    mkActivity('pdt-prova-disc', DISCIPLINES[3], 'Prova Discursiva', 'prova-disc', '2026-09-05', '2026-10-06', '2026-10-10', false),

    // Teoria da Cor
    mkAula('tc-aula-1', DISCIPLINES[4], 'Aula 1', 1, false),
    mkAula('tc-aula-2', DISCIPLINES[4], 'Aula 2', 2, false),
    mkAula('tc-aula-3', DISCIPLINES[4], 'Aula 3', 3, false),
    mkAula('tc-aula-4', DISCIPLINES[4], 'Aula 4', 4, false),
    mkActivity('tc-apol-obj', DISCIPLINES[4], 'APOL Objetiva', 'apol', '2026-07-28', '2026-09-04', '2026-09-08', false),
    mkActivity('tc-apol-disc', DISCIPLINES[4], 'APOL Discursiva', 'apol-disc', '2026-07-28', '2026-09-05', '2026-09-08', false),
    mkActivity('tc-prova-obj', DISCIPLINES[4], 'Prova Objetiva', 'prova-obj', '2026-09-08', '2026-10-12', '2026-10-17', false),
    mkActivity('tc-prova-disc', DISCIPLINES[4], 'Prova Discursiva', 'prova-disc', '2026-09-08', '2026-10-13', '2026-10-17', false),

    // Atividades Extensionistas (sem aulas — só entregas)
    mkActivity('ae-trab-1', DISCIPLINES[5], 'Certificado de curso 1', 'trabalho', '2026-07-13', '2026-08-15', '2026-11-30', false),
    mkActivity('ae-trab-2', DISCIPLINES[5], 'Certificado de curso 2', 'trabalho', '2026-07-13', '2026-09-15', '2026-11-30', false),
    mkActivity('ae-trab-3', DISCIPLINES[5], 'Relatório de atividades', 'trabalho', '2026-07-13', '2026-10-15', '2026-11-30', false),
    mkActivity('ae-trab-4', DISCIPLINES[5], 'Envio final da carga horária', 'trabalho', '2026-07-13', '2026-11-20', '2026-11-30', false)
  ];
  return seed;
}

/* ---------- Utilitários de data ---------- */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(dateStr, delta) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) {
  const [ay,am,ad] = a.split('-').map(Number);
  const [by,bm,bd] = b.split('-').map(Number);
  return Math.round((new Date(by,bm-1,bd) - new Date(ay,am-1,ad)) / 86400000);
}

/* ---------- Persistência (localStorage) ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tasks)) return parsed;
    }
  } catch (e) { /* dados corrompidos: recria a partir da seed */ }
  const fresh = { tasks: buildSeed(), updatedAt: null };
  saveData(fresh);
  return fresh;
}
function saveData(data) {
  data.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DATA = loadData();

/* ---------- Regras derivadas ---------- */
function effectiveDate(t) { return t.deadline || t.planned; }
function isOverdue(t) { return !isAula(t) && !t.done && !!effectiveDate(t) && effectiveDate(t) < todayStr(); }
function hasConflict(t) { return !isAula(t) && !!t.deadline && !!t.planned && t.planned > t.deadline; }
function hasEarlyConflict(t) { return !isAula(t) && !!t.opens && !!t.planned && t.planned < t.opens; }
function isToday(t) { return !isAula(t) && t.planned === todayStr(); }
function daysLeftLabel(t) {
  const n = daysBetween(todayStr(), effectiveDate(t));
  if (n === 0) return { text: 'hoje', cls: 'zero' };
  if (n < 0) return { text: `há ${Math.abs(n)}d`, cls: 'neg' };
  return { text: `em ${n}d`, cls: '' };
}
function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- Filtros (em memória) ---------- */
const filters = { disc: '', type: '', onlyToday: false };

function populateSelects() {
  const fDisc = document.getElementById('filterDisc');
  fDisc.innerHTML = '<option value="">Todas as disciplinas</option>' +
    DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join('');

  const fType = document.getElementById('filterType');
  fType.innerHTML = '<option value="">Todos os tipos</option>' +
    Object.entries(TYPE_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');

  const formDisc = document.getElementById('f-disc');
  formDisc.innerHTML = DISCIPLINES.map(d => `<option value="${d}">${d}</option>`).join('');

  const formType = document.getElementById('f-type');
  formType.innerHTML = Object.entries(TYPE_META).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
}

/* ---------- Ordenação: aulas em sequência, depois atividades por data ---------- */
function orderedTasksForDisc(tasks) {
  const aulas = tasks.filter(isAula).sort((a,b) => a.order - b.order);
  const activities = tasks.filter(t => !isAula(t)).sort((a,b) => (a.planned || '').localeCompare(b.planned || ''));
  return [...aulas, ...activities];
}

/* ---------- Render ---------- */
function renderStats() {
  const total = DATA.tasks.length;
  const done = DATA.tasks.filter(t => t.done).length;
  const overdue = DATA.tasks.filter(isOverdue).length;
  const today = DATA.tasks.filter(t => !t.done && isToday(t)).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <div class="num">${pct}%</div>
      <div class="label">Progresso geral</div>
      <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    </div>
    <div class="stat done"><div class="num">${done}/${total}</div><div class="label">Concluídas</div></div>
    <div class="stat overdue"><div class="num">${overdue}</div><div class="label">Atrasadas</div></div>
    <div class="stat today"><div class="num">${today}</div><div class="label">Para hoje</div></div>
  `;

  const banner = document.getElementById('todayBanner');
  if (today > 0) {
    banner.innerHTML = `<div class="today-banner">
      <span>📅 Hoje (${fmtDate(todayStr())}): ${today} tarefa${today>1?'s':''} planejada${today>1?'s':''}</span>
      <label class="chk" style="font-weight:400;"><input type="checkbox" id="bannerFocus"> Mostrar só essas</label>
    </div>`;
    document.getElementById('bannerFocus').checked = filters.onlyToday;
    document.getElementById('bannerFocus').addEventListener('change', e => {
      filters.onlyToday = e.target.checked;
      document.getElementById('filterToday').checked = e.target.checked;
      renderList();
    });
  } else {
    banner.innerHTML = '';
  }
}

function taskRowHtml(t) {
  const overdue = isOverdue(t);
  const conflict = hasConflict(t);
  const early = hasEarlyConflict(t);
  const today = !t.done && isToday(t);
  const cls = ['task'];
  if (t.done) cls.push('done');
  else if (overdue) cls.push('overdue');
  else if (conflict || early) cls.push('conflict');

  const metaParts = [];
  if (!isAula(t)) {
    if (t.opens) metaParts.push(`<span class="field">Abre: ${fmtDate(t.opens)}</span>`);
    metaParts.push(`<span class="field">Planejada: <input type="date" class="inp-planned" data-id="${t.id}" value="${t.planned}"></span>`);
    if (t.deadline) metaParts.push(`<span class="field">Prazo real: <strong>${fmtDate(t.deadline)}</strong></span>`);
    const dl = daysLeftLabel(t);
    metaParts.push(`<span class="field days-left ${dl.cls}">${dl.text}</span>`);
  }
  if (t.done && t.completedAt) metaParts.push(`<span class="field">Concluída em ${fmtDate(t.completedAt)}</span>`);
  if (t.custom) metaParts.push(`<button class="btn-danger-text" data-del="${t.id}">Excluir</button>`);

  return `
    <li class="${cls.join(' ')}" data-id="${t.id}">
      <input type="checkbox" class="chk-done" data-id="${t.id}" ${t.done ? 'checked' : ''}>
      <div class="task-body">
        <div class="task-top">
          <span class="badge type-${t.type}">${TYPE_META[t.type].short}</span>
          ${overdue ? '<span class="badge warn-overdue">⚠ Atrasada</span>' : ''}
          ${conflict ? '<span class="badge warn-conflict">⚠ Prazo ultrapassado</span>' : ''}
          ${early ? '<span class="badge warn-conflict">⚠ Planejada antes de abrir</span>' : ''}
          ${today ? '<span class="badge warn-today">📅 Hoje</span>' : ''}
        </div>
        <div class="task-title">${t.title}</div>
        <div class="task-meta">${metaParts.join('')}</div>
      </div>
    </li>
  `;
}

function renderList() {
  const list = document.getElementById('taskList');

  let tasks = [...DATA.tasks];
  if (filters.disc) tasks = tasks.filter(t => t.disc === filters.disc);
  if (filters.type) tasks = tasks.filter(t => t.type === filters.type);
  if (filters.onlyToday) tasks = tasks.filter(t => !t.done && isToday(t));

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">Nenhuma tarefa encontrada com esses filtros.</div>';
    return;
  }

  const discsToShow = filters.disc ? [filters.disc] : DISCIPLINES;
  let html = '';
  discsToShow.forEach(disc => {
    const discTasks = orderedTasksForDisc(tasks.filter(t => t.disc === disc));
    if (discTasks.length === 0) return;
    html += `<div class="disc-heading">${disc}</div>`;
    html += discTasks.map(taskRowHtml).join('');
  });
  list.innerHTML = html || '<div class="empty">Nenhuma tarefa encontrada com esses filtros.</div>';

  list.querySelectorAll('.chk-done').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const t = DATA.tasks.find(x => x.id === id);
      t.done = e.target.checked;
      t.completedAt = e.target.checked ? todayStr() : null;
      saveData(DATA);
      renderAll();
    });
  });
  list.querySelectorAll('.inp-planned').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const t = DATA.tasks.find(x => x.id === id);
      t.planned = e.target.value;
      saveData(DATA);
      renderAll();
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.target.dataset.del;
      DATA.tasks = DATA.tasks.filter(x => x.id !== id);
      saveData(DATA);
      renderAll();
      showToast('Tarefa excluída.');
    });
  });
}

function renderSavedInfo() {
  const el = document.getElementById('savedInfo');
  if (!DATA.updatedAt) { el.textContent = ''; return; }
  const d = new Date(DATA.updatedAt);
  el.textContent = `Última atualização: ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}`;
}

function renderAll() {
  renderStats();
  renderList();
  renderSavedInfo();
}

/* ---------- Ações ---------- */
document.getElementById('filterDisc').addEventListener('change', e => { filters.disc = e.target.value; renderList(); });
document.getElementById('filterType').addEventListener('change', e => { filters.type = e.target.value; renderList(); });
document.getElementById('filterToday').addEventListener('change', e => { filters.onlyToday = e.target.checked; renderList(); });

document.getElementById('btnToggleForm').addEventListener('click', () => {
  const form = document.getElementById('addForm');
  form.classList.toggle('open');
  if (form.classList.contains('open')) document.getElementById('f-planned').value = todayStr();
});
document.getElementById('btnCancelTask').addEventListener('click', () => {
  document.getElementById('addForm').classList.remove('open');
});
document.getElementById('f-type').addEventListener('change', e => {
  const isAulaType = e.target.value === 'aula';
  document.getElementById('aulaNote').style.display = isAulaType ? 'block' : 'none';
  document.getElementById('dateFields').style.display = isAulaType ? 'none' : 'grid';
});
document.getElementById('btnSaveTask').addEventListener('click', () => {
  const disc = document.getElementById('f-disc').value;
  const type = document.getElementById('f-type').value;
  const title = document.getElementById('f-title').value.trim();

  if (!title) {
    showToast('Preencha ao menos o título.');
    return;
  }

  const id = `custom-${Math.random().toString(36).slice(2, 10)}`;

  if (type === 'aula') {
    const order = DATA.tasks.filter(t => t.disc === disc && isAula(t)).length + 1;
    DATA.tasks.push({ id, disc, title, type: 'aula', order, opens: null, deadline: null, planned: null, originalPlanned: null, done: false, completedAt: null, custom: true });
  } else {
    const planned = document.getElementById('f-planned').value;
    if (!planned) { showToast('Preencha a data planejada.'); return; }
    const opens = document.getElementById('f-opens').value || null;
    const deadline = document.getElementById('f-deadline').value || null;
    DATA.tasks.push({ id, disc, title, type, order: null, opens, deadline, planned, originalPlanned: null, done: false, completedAt: null, custom: true });
  }
  saveData(DATA);

  document.getElementById('f-title').value = '';
  document.getElementById('f-opens').value = '';
  document.getElementById('f-deadline').value = '';
  document.getElementById('addForm').classList.remove('open');
  renderAll();
  showToast('Tarefa adicionada.');
});

document.getElementById('btnAdvance').addEventListener('click', () => {
  DATA.tasks.forEach(t => { if (!t.done && t.planned) t.planned = addDays(t.planned, -1); });
  saveData(DATA);
  renderAll();
  showToast('Datas planejadas adiantadas em 1 dia.');
});

document.getElementById('btnRestore').addEventListener('click', () => {
  if (!confirm('Restaurar todas as datas planejadas para o plano original? Isso não afeta o status de concluído nem tarefas adicionadas manualmente.')) return;
  DATA.tasks.forEach(t => { if (t.originalPlanned) t.planned = t.originalPlanned; });
  saveData(DATA);
  renderAll();
  showToast('Plano original restaurado.');
});

/* ---------- Init ---------- */
populateSelects();
renderAll();
</script>
</body>
</html>
